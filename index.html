<!DOCTYPE html>
<html>
  <head>
    <title>LGU AR Tourism - Porsche Exhibit</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      /* UI Styling */
      .ar-ui {
        position: fixed;
        z-index: 10;
        width: 100%;
        pointer-events: none; /* Allows clicking "through" the UI to the AR scene */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: white;
      }
      .header {
        top: 0;
        background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
        padding: 20px;
        text-align: center;
      }
      .footer {
        bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .instruction-box {
        background: rgba(0, 0, 0, 0.6);
        padding: 10px 20px;
        border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        font-size: 14px;
        backdrop-filter: blur(5px);
      }
      .btn {
        pointer-events: auto; /* Makes button clickable */
        background: #e74c3c;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 5px;
        font-weight: bold;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      }
    </style>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    
    <div class="ar-ui header">
      <h2 style="margin:0; letter-spacing: 2px;">DIGITAL EXHIBIT</h2>
      <p style="margin:5px 0 0; font-size: 12px; opacity: 0.8;">LGU HERITAGE & TOURISM PROJECT</p>
    </div>

    <div class="ar-ui footer">
      <div class="instruction-box">
        Center the <b>Ferrari Logo</b> in view
      </div>
      <button class="btn" onclick="alert('Redirecting to Casa Real Info...')">Learn More</button>
    </div>

    <a-scene 
      embedded 
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      
      <a-assets>
        <a-asset-item id="porsche" src="free_porsche_911_carrera_4s.glb"></a-asset-item>
      </a-assets>

      <a-marker type="pattern" url="pattern-180-1806418_ferrari-emblem-and-logo-logo-ferrari.patt">
        
        <a-entity 
          gltf-model="#porsche" 
          scale="0.05 0.05 0.05" 
          position="0 0.5 0" 
          rotation="0 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
