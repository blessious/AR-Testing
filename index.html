<!DOCTYPE html>
<html>
  <head>
    <title>AR Porsche - Direct View</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="minotaur" src="minotaur_berserker_-_free_game-ready_character.glb"></a-asset-item>
      </a-assets>
      
      <a-marker type="pattern" url="pattern-180-1806418_ferrari-emblem-and-logo-logo-ferrari.patt">
        
        <a-entity 
          gltf-model="#minotaur" 
          scale="1 1 1" 
          position="0 0 0" 
          rotation="0 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
        </a-entity>
      
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
