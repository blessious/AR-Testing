<!DOCTYPE html>
<html>
  <head>
    <title>AR Test</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="minotaur" src="DUCK.glb"></a-asset-item>
      </a-assets>

      <!-- Hiro marker - blue box + DUCK model -->
      <a-marker preset="hiro">
        <a-box position="0 0.5 0" material="color: blue;"></a-box>
        <a-entity 
          gltf-model="#minotaur" 
          scale="1 1 1" 
          position="0 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
        </a-entity>
      </a-marker>

      <!-- Ferrari pattern marker - red box + DUCK model -->
      <a-marker type="pattern" url="pattern-180-1806418_ferrari-emblem-and-logo-logo-ferrari.patt">
        <a-box position="0 0.5 0" material="color: red;"></a-box>
        <a-entity 
          gltf-model="#minotaur" 
          scale="1 1 1" 
          position="0 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
